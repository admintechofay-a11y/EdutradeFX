<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F5BFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="380" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F1F5F9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="0.6" stop-color="#1F5BFF"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F5BFF"/>
      <stop offset="1" stop-color="#1F5BFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="1" stop-color="#16A34A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow1" x="-10" y="-10" width="460" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071B4D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background decorative floating elements -->
  <circle cx="480" cy="120" r="100" fill="url(#bgGlow)"/>
  <circle cx="120" cy="380" r="140" fill="url(#bgGlow)"/>

  <!-- Main Trading Terminal Card -->
  <g filter="url(#shadow1)">
    <rect x="70" y="50" width="460" height="300" rx="24" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Header of card -->
    <rect x="70" y="50" width="460" height="56" rx="24" fill="#0A2A6B"/>
    <rect x="70" y="86" width="460" height="20" fill="#0A2A6B"/>
    <circle cx="104" cy="78" r="6" fill="#EF4444"/>
    <circle cx="124" cy="78" r="6" fill="#F59E0B"/>
    <circle cx="144" cy="78" r="6" fill="#16A34A"/>
    <text x="180" y="83" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">EUR/USD · Live Market Execution</text>
    <rect x="440" y="68" width="70" height="20" rx="10" fill="#16A34A"/>
    <text x="456" y="82" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">+1.42%</text>

    <!-- Candlestick chart grid -->
    <line x1="100" y1="160" x2="500" y2="160" stroke="#E2E8F0" stroke-dasharray="4 4"/>
    <line x1="100" y1="220" x2="500" y2="220" stroke="#E2E8F0" stroke-dasharray="4 4"/>
    <line x1="100" y1="280" x2="500" y2="280" stroke="#E2E8F0" stroke-dasharray="4 4"/>

    <!-- Volume Bars -->
    <rect x="120" y="270" width="14" height="40" rx="3" fill="url(#barGrad1)"/>
    <rect x="150" y="240" width="14" height="70" rx="3" fill="url(#barGrad2)"/>
    <rect x="180" y="260" width="14" height="50" rx="3" fill="url(#barGrad1)"/>
    <rect x="210" y="220" width="14" height="90" rx="3" fill="url(#barGrad2)"/>
    <rect x="240" y="250" width="14" height="60" rx="3" fill="url(#barGrad2)"/>
    <rect x="270" y="210" width="14" height="100" rx="3" fill="url(#barGrad2)"/>
    <rect x="300" y="230" width="14" height="80" rx="3" fill="url(#barGrad1)"/>
    <rect x="330" y="190" width="14" height="120" rx="3" fill="url(#barGrad2)"/>
    <rect x="360" y="220" width="14" height="90" rx="3" fill="url(#barGrad1)"/>
    <rect x="390" y="170" width="14" height="140" rx="3" fill="url(#barGrad2)"/>
    <rect x="420" y="160" width="14" height="150" rx="3" fill="url(#barGrad2)"/>
    <rect x="450" y="140" width="14" height="170" rx="3" fill="url(#barGrad2)"/>

    <!-- Dynamic Trend Curve -->
    <path d="M 110 270 Q 180 240, 240 210 T 360 180 T 480 130" fill="none" stroke="url(#chartLine)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pulse Point on active candle -->
    <circle cx="480" cy="130" r="10" fill="#FF6A00" fill-opacity="0.3"/>
    <circle cx="480" cy="130" r="5" fill="#FF6A00"/>
  </g>

  <!-- Floating Badge 1: Verified Regulated -->
  <g filter="url(#shadow1)">
    <rect x="40" y="280" width="180" height="64" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="52" y="294" width="36" height="36" rx="10" fill="#16A34A"/>
    <path d="M 64 312 L 68 316 L 76 308" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="311" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">FCA Regulated</text>
    <text x="96" y="325" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500">Tier-1 Segregated</text>
  </g>

  <!-- Floating Badge 2: Signal Win Rate -->
  <g filter="url(#shadow1)">
    <rect x="370" y="310" width="190" height="68" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="382" y="326" width="36" height="36" rx="10" fill="#1F5BFF"/>
    <path d="M 394 348 L 400 340 L 406 344 L 412 336" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="426" y="343" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">89.4% Win Rate</text>
    <text x="426" y="357" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="500">Audited Signal Calls</text>
  </g>
</svg>
