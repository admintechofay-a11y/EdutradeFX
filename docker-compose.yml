version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edutradefx_postgres
    restart: always
    environment:
      POSTGRES_USER: edutrade_admin
      POSTGRES_PASSWORD: edutrade_secure_password
      POSTGRES_DB: edutradefx_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrade_admin -d edutradefx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutradefx_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://edutrade_admin:edutrade_secure_password@postgres:5432/edutradefx_db?schema=public
      JWT_ACCESS_SECRET: super_secure_access_jwt_secret_change_in_production_12345
      JWT_REFRESH_SECRET: super_secure_refresh_jwt_secret_change_in_production_67890
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edutradefx_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
