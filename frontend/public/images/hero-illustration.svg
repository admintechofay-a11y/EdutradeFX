<svg width="600" height="460" viewBox="0 0 600 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 120) rotate(90) scale(140)">
      <stop stop-color="#1F5BFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1F5BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 360) rotate(90) scale(160)">
      <stop stop-color="#FF6A00" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="70" y1="50" x2="530" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="110" y1="270" x2="480" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A34A"/>
      <stop offset="0.55" stop-color="#1F5BFF"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1F5BFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1F5BFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#16A34A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#16A34A" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadowCard" x="-15%" y="-15%" width="130%" height="135%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071B4D" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowBadge" x="-20%" y="-20%" width="140%" height="150%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071B4D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient background glow orbs -->
  <circle cx="480" cy="120" r="140" fill="url(#heroGlow1)"/>
  <circle cx="120" cy="360" r="160" fill="url(#heroGlow2)"/>

  <!-- Main Trading Terminal Card -->
  <g filter="url(#shadowCard)">
    <rect x="70" y="50" width="460" height="300" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Card Header / Titlebar -->
    <path d="M 70 70 A 20 20 0 0 1 90 50 L 510 50 A 20 20 0 0 1 530 70 L 530 106 L 70 106 Z" fill="#0A2A6B"/>
    <circle cx="104" cy="78" r="6" fill="#EF4444"/>
    <circle cx="124" cy="78" r="6" fill="#F59E0B"/>
    <circle cx="144" cy="78" r="6" fill="#16A34A"/>
    <text x="180" y="83" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700">EUR/USD · Live Market Execution</text>
    <rect x="440" y="68" width="70" height="20" rx="10" fill="#16A34A"/>
    <text x="456" y="82" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">+1.42%</text>

    <!-- Candlestick chart grid -->
    <line x1="100" y1="160" x2="500" y2="160" stroke="#E2E8F0" stroke-dasharray="4 4"/>
    <line x1="100" y1="220" x2="500" y2="220" stroke="#E2E8F0" stroke-dasharray="4 4"/>
    <line x1="100" y1="280" x2="500" y2="280" stroke="#E2E8F0" stroke-dasharray="4 4"/>

    <!-- Volume Bars -->
    <rect x="120" y="270" width="14" height="40" rx="3" fill="url(#barGrad1)"/>
    <rect x="150" y="240" width="14" height="70" rx="3" fill="url(#barGrad2)"/>
    <rect x="180" y="260" width="14" height="50" rx="3" fill="url(#barGrad1)"/>
    <rect x="210" y="220" width="14" height="90" rx="3" fill="url(#barGrad2)"/>
    <rect x="240" y="250" width="14" height="60" rx="3" fill="url(#barGrad2)"/>
    <rect x="270" y="210" width="14" height="100" rx="3" fill="url(#barGrad2)"/>
    <rect x="300" y="230" width="14" height="80" rx="3" fill="url(#barGrad1)"/>
    <rect x="330" y="190" width="14" height="120" rx="3" fill="url(#barGrad2)"/>
    <rect x="360" y="220" width="14" height="90" rx="3" fill="url(#barGrad1)"/>
    <rect x="390" y="170" width="14" height="140" rx="3" fill="url(#barGrad2)"/>
    <rect x="420" y="160" width="14" height="150" rx="3" fill="url(#barGrad2)"/>
    <rect x="450" y="140" width="14" height="170" rx="3" fill="url(#barGrad2)"/>

    <!-- Dynamic Trend Curve -->
    <path d="M 110 270 Q 180 240, 240 210 T 360 180 T 480 130" fill="none" stroke="url(#chartLine)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pulse Point on active candle -->
    <circle cx="480" cy="130" r="10" fill="#FF6A00" fill-opacity="0.25"/>
    <circle cx="480" cy="130" r="5" fill="#FF6A00"/>
  </g>

  <!-- Floating Badge 1: Verified Regulated (Bottom Left) -->
  <g filter="url(#shadowBadge)">
    <rect x="40" y="280" width="184" height="68" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="52" y="296" width="36" height="36" rx="10" fill="#16A34A"/>
    <path d="M 64 314 L 68 318 L 76 310" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="313" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">FCA Regulated</text>
    <text x="98" y="327" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">Tier-1 Segregated</text>
  </g>

  <!-- Floating Badge 2: Signal Win Rate (Bottom Right) -->
  <g filter="url(#shadowBadge)">
    <rect x="370" y="300" width="194" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="382" y="317" width="36" height="36" rx="10" fill="#1F5BFF"/>
    <path d="M 394 339 L 400 331 L 406 335 L 412 327" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="428" y="334" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">89.4% Win Rate</text>
    <text x="428" y="348" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">Audited Signal Calls</text>
  </g>
</svg>
